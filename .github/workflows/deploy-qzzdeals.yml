name: Deploy qzzdeals

on:
  push:
    branches: [main]
    paths:
      - 'nginx/www/qzzdeals/**'
      - 'node/Dockerfile'
      - 'nginx/sites/qzzdeals.ru.conf'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            cd ~/docker
            git pull
            docker compose up -d --build node-qzz
            docker exec nginx-proxy nginx -s reload
