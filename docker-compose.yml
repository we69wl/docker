  #     - app-network
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

  # python:
  #   build: ./python
  #   container_name: sheets-backend
  #   restart: unless-stopped
  #   env_file:
  #     - ./python/.env
  #   volumes:
  #     - ./python/credentials.json:/app/credentials.json:ro
  #     - ./logs/python:/app/logs
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --deploy-hook 'echo reload > /tmp/reload'; sleep 12h & wait $${!}; done"
    networks:
      - app-network   # ← добавить сеть

