version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/www:/var/www
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - php
      - mysql

  php:
    build:
      context: ./php/php8.3
      dockerfile: Dockerfile
    container_name: php-fpm
    restart: unless-stopped
    volumes:
      - ./nginx/www:/var/www
      - ./php/php8.3/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_DISPLAY_ERRORS=Off
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --deploy-hook 'echo reload > /tmp/reload'; sleep 12h & wait $${!}; done"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache: