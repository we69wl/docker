services:
  nginx:
    build: ./nginx
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/www:/var/www:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/certbot-www:rw
      - ./logs/nginx:/var/log/nginx
      - nginx-cache:/var/cache/nginx   # новая строка для кэша
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - php
      - python
      - node-qzz

  php:
    build: ./php
    container_name: php-fpm
    restart: unless-stopped
    volumes:
      - ./nginx/www:/var/www
      - ./logs/php:/var/log/php
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  node-qzz:
    build:
      context: .
      dockerfile: node/Dockerfile
    container_name: node-qzz
    restart: unless-stopped
    env_file:
      - ./nginx/www/qzzdeals/backend/.env
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  python:
    build: ./python
    container_name: sheets-backend
    restart: unless-stopped
    env_file:
      - ./python/.env
    volumes:
      - ./python/credentials.json:/app/credentials.json:ro
      - ./logs/python:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --deploy-hook 'echo reload > /tmp/reload'; sleep 12h & wait $${!}; done"
    networks:
      - app-network   # ← добавить сеть

  markitdown:
    build: ./services/markitdown
    image: markitdown:latest

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache: