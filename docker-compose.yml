services:
  nginx:
    build: ./nginx
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/www:/var/www:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:rw
      - ./logs/nginx:/var/log/nginx
      - nginx-cache:/var/cache/nginx   # новая строка для кэша
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - php
      - php85
      # - python
      # - node-qzz

  php:
    build: ./php
    container_name: php-fpm
    restart: unless-stopped
    volumes:
      - ./nginx/www:/var/www
      - ./logs/php:/var/log/php
    networks:
      - app-network

  php85:
    build: ./php/php8.5
    container_name: php85-fpm
    restart: unless-stopped
    volumes:
      - ./nginx/www:/var/www
      - ./logs/php85:/var/log/php85
      - ./php85-xray:/usr/local/bin/xray:ro
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # node-qzz:
