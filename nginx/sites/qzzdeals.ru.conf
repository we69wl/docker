server {
    listen 80;
    listen [::]:80;
    server_name qzzdeals.ru www.qzzdeals.ru;

    # ACME challenge for certbot (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qzzdeals.ru www.qzzdeals.ru;

    ssl_certificate     /etc/letsencrypt/live/qzzdeals.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qzzdeals.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Document root
    root /var/www/qzzdeals;
    index index.html;

    # Logging
    access_log /var/log/nginx/qzzdeals.ru.access.log;
    error_log  /var/log/nginx/qzzdeals.ru.error.log;

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://node-qzz:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files, fallback to index.html (for SPAs)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for HTML (always fresh)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Uncomment and tighten once you know your asset origins:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml font/woff2;

    # Block dotfiles (e.g. .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block backup / source files
    location ~* \.(bak|swp|orig|log|sql|sh)$ {
        deny all;
        return 404;
    }
}