[PHP]
; --- Лимиты ресурсов ---
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

; --- Загрузка файлов ---
upload_max_filesize = 64M
post_max_size = 64M

; --- Вывод ошибок (для локальной разработки) ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; --- Оптимизация файловой системы ---
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- Часовой пояс ---
date.timezone = Europe/Moscow

[opcache]
; --- Настройки OPcache для локальной разработки ---
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Проверять изменения файлов при каждом запросе (чтобы код обновлялся на лету)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Обязательно для работы атрибутов/аннотаций в PHP и Laravel
opcache.save_comments = 1